services:
  - type: web
    name: product-price-tracker-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: CRON_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
